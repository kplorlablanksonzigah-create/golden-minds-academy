<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Minds Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #1a365d, #0b1d3a 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            border-top: 8px solid #70e000;
            border-bottom: 8px solid #ff7b00;
        }

        h1 {
            color: #0b1d3a;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 14px 24px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Navy Blue Button */
        .btn-admin {
            background-color: #0b1d3a;
        }
        .btn-admin:hover {
            background-color: #1a365d;
            transform: translateY(-2px);
        }

        /* Orange Button */
        .btn-teacher {
            background-color: #ff7b00;
        }
        .btn-teacher:hover {
            background-color: #e06d00;
            transform: translateY(-2px);
        }

        /* Lemon Green Accent Button for Accounts */
        .btn-accounts {
            background-color: #70e000;
            color: #0b1d3a;
            font-weight: 700;
        }
        .btn-accounts:hover {
            background-color: #5cb800;
            transform: translateY(-2px);
        }

        .divider {
            margin: 25px 0;
            border-top: 2px dashed #e2e8f0;
        }

        .btn-staff {
            background-color: #f8fafc;
            color: #0b1d3a;
            border: 2px solid #0b1d3a;
            font-weight: 700;
        }
        .btn-staff:hover {
            background-color: #0b1d3a;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Golden Minds Academy</h1>
        <p class="subtitle">Please select your destination portal to continue:</p>

        <div class="btn-group">
            <a href="/login" class="btn btn-admin">Admin Portal</a>
            <a href="/login" class="btn btn-teacher">Teacher Portal</a>
            <a href="/login" class="btn btn-accounts">Accounts Portal</a>
        </div>

        <div class="divider"></div>

        <p class="subtitle" style="margin-bottom: 12px; font-size: 14px; font-weight: 700; color: #0b1d3a;">Public Directory</p>
        <a href="/staff" class="btn btn-staff">View Faculty Directory</a>
    </div>
</body>
</html>
