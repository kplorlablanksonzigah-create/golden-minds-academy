<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Golden Minds Academy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #1a365d, #0b1d3a 70%);
            min-height: 100vh;
            color: #333;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            border-top: 6px solid #70e000;
            border-bottom: 6px solid #ff7b00;
        }

        h2 {
            color: #0b1d3a;
            font-size: 24px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: #0b1d3a;
            margin-bottom: 5px;
        }

        input {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0b1d3a;
            box-shadow: 0 0 0 3px rgba(11, 29, 58, 0.1);
        }

        .btn-save {
            background-color: #70e000;
            color: #0b1d3a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-save:hover {
            background-color: #5cb800;
        }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #ff7b00;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .btn-cancel:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Edit Student Details</h2>
        <p class="subtitle">Update basic details and customized fee rates for <strong>{{ student.name }}</strong>.</p>

        <form action="/edit_student/{{ student.id }}" method="POST">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Full Name</label>
                    <input type="text" name="name" value="{{ student.name }}" required>
                </div>

                <div class="form-group">
                    <label>Class / Grade</label>
                    <input type="text" name="grade" value="{{ student.grade }}" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" value="{{ student.age }}" required>
                </div>

                <div class="form-group">
                    <label>Tuition Fee (GH₵)</label>
                    <input type="number" name="tuition" step="0.01" value="{{ student.tuition or 300.00 }}" required>
                </div>

                <div class="form-group">
                    <label>Breakfast Fee (GH₵)</label>
                    <input type="number" name="breakfast" step="0.01" value="{{ student.breakfast or 80.00 }}" required>
                </div>

                <div class="form-group">
                    <label>Lunch Fee (GH₵)</label>
                    <input type="number" name="lunch" step="0.01" value="{{ student.lunch or 120.00 }}" required>
                </div>

                <div class="form-group">
                    <label>Transportation Fee (GH₵)</label>
                    <input type="number" name="transportation" step="0.01" value="{{ student.transportation or 100.00 }}" required>
                </div>
            </div>

            <button type="submit" class="btn-save">Save Changes</button>
            <a href="/admin_dashboard" class="btn-cancel">Cancel & Return to Admin</a>
        </form>
    </div>

</body>
</html>
